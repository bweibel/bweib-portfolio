name: Deploy to Hostinger

# Build the static site and rsync dist/ to Hostinger over SSH on every push to
# main. Credentials live in repo secrets (Settings → Secrets and variables →
# Actions), never in the repo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; cancel an in-flight one if a newer push lands.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy dist/ via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Hostinger load-balances SSH across backends that present different
          # host keys, so the key can't be pinned reliably — verification would
          # fail intermittently. Trust is established by our deploy key instead.
          SSH_OPTS="-i ~/.ssh/deploy_key -p $SSH_PORT \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o LogLevel=ERROR"

          # Trailing slash on dist/ uploads its *contents* into DEPLOY_PATH.
          # --delete mirrors the directory, removing files no longer in the build.
          # --exclude protects server-only files that live in the web root but
          # never exist in the build: the SMTP secrets (created by hand) and the
          # Asteroids leaderboard store (written by scores.php at runtime).
          rsync -avz --delete \
            --exclude 'mail-secrets.php' --exclude 'scores.json' \
            -e "ssh $SSH_OPTS" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
