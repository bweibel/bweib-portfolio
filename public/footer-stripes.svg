<svg xmlns="http://www.w3.org/2000/svg" width="6000" height="64" viewBox="0 0 6000 64" fill="none">
  <!--
    Three parallel signal lines (teal · amber · red). Each starts at the left
    edge (x=0) — stacked up the edge, bottom line flush to the bottom — rises
    up-right at 45°, then turns horizontal and runs to the right edge.
    Center-to-center spacing s = 12 (stroke 4 + gap 8). Feet are spaced s*√2 ≈
    16.97 up the edge so the perpendicular gap stays a constant 12 through the
    turn and along the horizontals (y = 10 / 22 / 34). Taller viewBox = longer
    45° rise before each line flattens.
  -->
  <g stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="12">
    <path d="M0 30.06 L20.06 10 H6000" stroke="#2bb3a3"/>
    <path d="M0 47.03 L25.03 22 H6000" stroke="#f2b900"/>
    <path d="M0 64 L30 34 H6000" stroke="#e8472b"/>
  </g>
</svg>
